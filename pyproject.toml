[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-devops-cost-optimizer"
version = "0.1.0"
description = "A free-first, read-only AWS and DevOps cost optimization toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
aws-cost-optimizer = "cost_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
